# Défi : événements de réconciliation envoyés vers un webhook de test.
# Créer une URL sur https://webhook.site puis la mettre dans le Secret (hors Git) :
#   kubectl -n flux-system create secret generic webhook-url --from-literal=address=https://webhook.site/<id>
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: webhook-test
  namespace: flux-system
spec:
  type: generic
  secretRef:
    name: webhook-url
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: apps-events
  namespace: flux-system
spec:
  providerRef:
    name: webhook-test
  eventSeverity: info
  eventSources:
    - kind: Kustomization
      name: apps-dev
    - kind: HelmRelease
      name: whoami
